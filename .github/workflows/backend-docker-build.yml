name: Backend and Frontend Docker Build and Push

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      BACKEND_IMAGE_NAME: ${{ github.repository_owner }}/offerpilot-backend
      FRONTEND_IMAGE_NAME: ${{ github.repository_owner }}/offerpilot-frontend
      IMAGE_TAG: ${{ github.sha }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21
        cache: maven

    - name: Set up Node.js 24
      uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: job-portal-frontend/package-lock.json

    - name: Run Backend Tests
      run: mvn -f job-portal-backend/pom.xml test

    - name: Install Frontend Dependencies
      working-directory: job-portal-frontend
      run: npm ci

    - name: Run Frontend Tests
      working-directory: job-portal-frontend
      run: npm test

    - name: Lint Frontend
      working-directory: job-portal-frontend
      run: npm run lint

    - name: Build Backend JAR
      run: mvn -f job-portal-backend/pom.xml clean package -DskipTests

    - name: Log in to Docker Hub
      if: ${{ env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != '' }}
      uses: docker/login-action@v4
      with:
        username: ${{ env.DOCKER_USERNAME }}
        password: ${{ env.DOCKER_PASSWORD }}

    - name: Build Backend Docker Image
      run: |
        docker build -t $BACKEND_IMAGE_NAME:$IMAGE_TAG -t $BACKEND_IMAGE_NAME:latest job-portal-backend

    - name: Build Frontend Docker Image
      run: |
        docker build -t $FRONTEND_IMAGE_NAME:$IMAGE_TAG -t $FRONTEND_IMAGE_NAME:latest job-portal-frontend

    - name: Push Backend Docker Image
      if: ${{ env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != '' }}
      run: |
        docker push $BACKEND_IMAGE_NAME:$IMAGE_TAG
        docker push $BACKEND_IMAGE_NAME:latest

    - name: Push Frontend Docker Image
      if: ${{ env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != '' }}
      run: |
        docker push $FRONTEND_IMAGE_NAME:$IMAGE_TAG
        docker push $FRONTEND_IMAGE_NAME:latest

  e2e:
    name: Playwright E2E (non-destructive UI suite)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: jobportal
          MYSQL_USER: jobuser
          MYSQL_PASSWORD: jobpass
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
      rabbitmq:
        image: rabbitmq:4.2-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: jobuser
          RABBITMQ_DEFAULT_PASS: jobpass
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/jobportal?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: jobuser
      SPRING_DATASOURCE_PASSWORD: jobpass
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      RABBITMQ_HOST: 127.0.0.1
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: jobuser
      RABBITMQ_PASSWORD: jobpass
      JWT_SECRET_KEY: ci-e2e-secret-key-at-least-32-bytes-long
      ALLOWED_ORIGINS: http://localhost:5173
      FRONTEND_BASE_URL: http://localhost:5173
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21
        cache: maven

    - name: Set up Node.js 24
      uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: job-portal-frontend/package-lock.json

    - name: Build backend JAR
      run: mvn -B -ntp -f job-portal-backend/pom.xml package -DskipTests

    - name: Start backend
      env:
        RESUME_STORAGE_ROOT: ${{ runner.temp }}/resumes
      run: |
        JAR=$(ls job-portal-backend/target/jobportal-*.jar | head -n1)
        nohup java -jar "$JAR" > backend.log 2>&1 &
        echo $! > backend.pid
        for i in $(seq 1 60); do
          if curl -fsS http://localhost:8080/actuator/health >/dev/null; then
            echo "backend is ready"
            exit 0
          fi
          sleep 2
        done
        echo "backend did not become healthy"
        cat backend.log
        exit 1

    - name: Seed a job for the browser suite
      run: |
        TOKEN=$(curl -fsS -u admin@local.test:admin123 -X POST http://localhost:8080/api/auth/login | jq -r .token)
        test "$TOKEN" != "null"
        curl -fsS -X POST http://localhost:8080/api/jobs \
          -H "Authorization: Bearer $TOKEN" \
          -H "Content-Type: application/json" \
          -d '{"title":"CI E2E 岗位","company":"CI 验证公司","description":"用于 GitHub Actions E2E 的开放岗位。Java Spring Boot MySQL Redis RabbitMQ Docker。"}'

    - name: Build frontend
      working-directory: job-portal-frontend
      run: |
        npm ci
        npm run build

    - name: Start frontend preview
      working-directory: job-portal-frontend
      run: |
        nohup npm run preview -- --host 0.0.0.0 --port 5173 > preview.log 2>&1 &
        for i in $(seq 1 30); do
          if curl -fsS http://localhost:5173/ >/dev/null; then
            echo "frontend is ready"
            exit 0
          fi
          sleep 2
        done
        echo "frontend did not become ready"
        cat preview.log
        exit 1

    - name: Install Playwright Chromium
      working-directory: job-portal-frontend
      run: npx playwright install --with-deps chromium

    - name: Run non-destructive browser suite
      working-directory: job-portal-frontend
      run: npx playwright test ui-redesign.spec.js --workers=1

    - name: Upload E2E artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-artifacts
        path: |
          job-portal-frontend/test-results
          docs/ui-redesign/screenshots
          backend.log
          job-portal-frontend/preview.log
        if-no-files-found: ignore
