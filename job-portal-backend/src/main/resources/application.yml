spring:
  application:
    name: jobportal
  cache:
    type: redis
    cache-names: jobs-open,jobs-all,job-by-id
    redis:
      time-to-live: ${CACHE_TTL:5m}
      key-prefix: ${CACHE_KEY_PREFIX:offerpilot::}
      use-key-prefix: true
      cache-null-values: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}
      timeout: ${REDIS_COMMAND_TIMEOUT:500ms}
      repositories:
        enabled: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/jobportal?createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:jobuser}
    password: ${SPRING_DATASOURCE_PASSWORD:jobpass}
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: validate
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  # Google OAuth2 Configuration (use environment variables for production)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:enter-the-client-id-here}
            client-secret: ${GOOGLE_CLIENT_SECRET:enter-the-client-secret-here}
            scope: openid,profile,email
        provider:
          google:
            user-name-attribute: email

logging:
  level:
    org:
      hibernate:
        type:
          descriptor:
            sql:
              BasicBinder: TRACE

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

# JWT Secret Key - should be at least 256 bits for HS256
jwt:
  secret: ${JWT_SECRET_KEY:MY_SECRET_KEY_123456789012345678901234567890}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
