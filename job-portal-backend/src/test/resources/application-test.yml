spring:
  cache:
    type: none
  datasource:
    url: jdbc:h2:mem:jobportal;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  sql:
    init:
      mode: never
  rabbitmq:
    listener:
      simple:
        auto-startup: false
resume:
  storage:
    root: ${java.io.tmpdir}/offerpilot-test-resumes-${random.uuid}
  processing:
    publisher:
      enabled: false
    listener:
      enabled: false
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
management:
  health:
    rabbit:
      enabled: false
    redis:
      enabled: false
